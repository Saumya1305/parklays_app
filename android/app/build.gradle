plugins {
    id "com.android.application"
    id "kotlin-android" // ✅ keep this, it’s required
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services" // ✅ apply Google services plugin here
}

android {
    namespace = "com.example.parklays"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId = "com.example.parklays"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

dependencies {
    // Firebase BoM (manages versions automatically)
    implementation platform("com.google.firebase:firebase-bom:34.1.0")

    // Firebase Authentication
    implementation "com.google.firebase:firebase-auth"

    // Firebase Analytics (optional)
    implementation "com.google.firebase:firebase-analytics"

    // ✅ Kotlin stdlib (use fixed version number instead of variable)
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"

    // ✅ Enable desugaring for Java 8 features
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.2'
}

flutter {
    source = "../.."
}


